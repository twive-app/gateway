name: lint

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    name: Typecheck & ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from the release tag – the workflows write it into package.json while building.
      - name: Placeholder version
        run: |
          if [ "$(jq -r .version package.json)" != "0.0.0" ]; then
            echo "::error file=package.json::package.json must keep version 0.0.0 – the release workflows set the version from the tag"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: ESLint
        run: bun run lint:check

  # PRs are merged with a merge commit, so every commit of the PR lands on dev – each one is checked, not only the title.
  # commitlint skips merge commits by default (defaultIgnores).
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Commitlint
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
