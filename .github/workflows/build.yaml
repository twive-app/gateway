name: build

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going; pushes to main/dev always finish.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only changes to the code or the build need a build – documentation-only changes skip it.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare with the base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE...$PR_HEAD"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi

          # A new branch or a force push has no usable base – build to be safe.
          if ! files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "No usable base for $range, building"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"
          if grep -qE '^(src/|package\.json$|bun\.lock$|tsconfig\.json$|\.github/workflows/build\.yaml$)' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code changes, the build is skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  binary:
    name: Compile ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: bun-linux-x64-baseline
            platform: linux/amd64
          - arch: arm64
            target: bun-linux-arm64
            platform: linux/arm64
    services:
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: |
          mkdir -p dist
          bun build src/index.ts --compile --target=${{ matrix.target }} \
            --minify-whitespace --minify-syntax --sourcemap --outfile dist/gateway-linux-${{ matrix.arch }}

      # The arm64 binary runs emulated – only this smoke test needs QEMU, the Docker image is cross-compiled.
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # Runs the binary in the runtime base image of the Docker image: --version, start, healthcheck, SIGTERM.
      - name: Smoke test
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: /dist/gateway-linux-${{ matrix.arch }}
        run: |
          set -euo pipefail
          IMAGE=gcr.io/distroless/cc-debian13:nonroot
          OPTS=(--platform "$PLATFORM" --network host -v "$PWD/dist:/dist:ro"
            -e REDIS_HOST=127.0.0.1
            -e TWITCH_WEBHOOK_CALLBACK_URL=https://example.com/twitch/webhook/callback
            -e TWITCH_WEBHOOK_SECRET=smoke-test-secret)

          VERSION=$(docker run --rm "${OPTS[@]}" "$IMAGE" "$BINARY" --version)
          echo "Version: $VERSION"
          test "$VERSION" = "$(jq -r .version package.json)"

          docker run -d --name gateway "${OPTS[@]}" "$IMAGE" "$BINARY"
          healthy=0
          for _ in $(seq 1 30); do
            if docker run --rm "${OPTS[@]}" "$IMAGE" "$BINARY" healthcheck; then healthy=1; break; fi
            sleep 2
          done

          docker stop --time 10 gateway
          docker logs gateway
          test "$healthy" = 1
          test "$(docker inspect -f "{{.State.ExitCode}}" gateway)" = 0
          docker logs gateway 2>&1 | grep -q "All shutdown hooks completed"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-linux-${{ matrix.arch }}
          path: dist/gateway-linux-${{ matrix.arch }}
          retention-days: 7

  # The one check to require in the branch rulesets: green when both binaries built or the build was not needed,
  # red when a build failed or was cancelled.
  result:
    name: Build
    needs: [changes, binary]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the build result
        env:
          CHANGES: ${{ needs.changes.result }}
          BINARY: ${{ needs.binary.result }}
        run: |
          echo "changes: $CHANGES, binary: $BINARY"
          [ "$CHANGES" = "success" ] || exit 1
          [ "$BINARY" = "success" ] || [ "$BINARY" = "skipped" ] || exit 1
