name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The tag must be exactly "v" + the version in package.json – bump package.json before tagging.
      - name: Check version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error file=package.json::Invalid version '$VERSION' – use X.Y.Z or X.Y.Z-alpha.N, X.Y.Z-beta.N, X.Y.Z-rc.N"
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the version $VERSION in package.json – bump package.json, then tag v$VERSION"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      # Same flags as the Dockerfile; the version of package.json is embedded (gateway --version, GET /health).
      - name: Compile binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for build in x64:bun-linux-x64-baseline arm64:bun-linux-arm64; do
            arch=${build%%:*}
            target=${build#*:}
            bun build src/index.ts --compile --target="$target" \
              --minify-whitespace --minify-syntax --sourcemap --outfile "gateway-linux-$arch"
          done
          test "$(./gateway-linux-x64 --version)" = "${TAG#v}"

      - name: Create checksum
        run: sha256sum gateway-linux-x64 gateway-linux-arm64 > checksum.txt

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            gateway-linux-x64
            gateway-linux-arm64
            checksum.txt
