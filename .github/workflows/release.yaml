name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The version comes from the tag: vX.Y.Z or vX.Y.Z-alpha.N / -beta.N / -rc.N, written into package.json.
      - name: Set version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$TAG" == v* && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid tag '$TAG' – use vX.Y.Z or vX.Y.Z-alpha.N, vX.Y.Z-beta.N, vX.Y.Z-rc.N"
            exit 1
          fi
          bun pm pkg set version="$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      # Keeps a state with the real version in the repository: branch release/vX.Y.Z = the tagged commit plus the
      # version bump of package.json. main and dev keep the placeholder 0.0.0.
      - name: Create release branch and bump version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/$TAG"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "ci(Release): bump version to $VERSION"
          git push -u origin "$BRANCH"

      # Same flags as the Dockerfile; the version from the tag is embedded (gateway --version, GET /health).
      - name: Compile binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for build in x64:bun-linux-x64-baseline arm64:bun-linux-arm64; do
            arch=${build%%:*}
            target=${build#*:}
            bun build src/index.ts --compile --target="$target" \
              --minify-whitespace --minify-syntax --sourcemap --outfile "gateway-linux-$arch"
          done
          test "$(./gateway-linux-x64 --version)" = "${TAG#v}"

      - name: Create checksum
        run: sha256sum gateway-linux-x64 gateway-linux-arm64 > checksum.txt

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            gateway-linux-x64
            gateway-linux-arm64
            checksum.txt
