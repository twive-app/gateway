name: Docker Publish

on:
  push:
    branches:
      - main
      - dev
  release:
    types:
      - published
  # Weekly rebuild of the latest release with updated base images.
  schedule:
    - cron: '0 0 * * 1'
  # Test images from any branch: Actions → docker-publisher → Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. test-login-fix (empty = test-<branch>). Not allowed: latest, main, dev, alpha, beta, rc, v*"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Releases and scheduled builds always run, even if the tagged commit contains [docker skip].
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'skip docker') && !contains(github.event.head_commit.message, 'docker skip'))"
    steps:
      # Fetch the latest release tag before checkout and metadata so we can check out the correct ref and tag the image.
      - name: Get latest release tag (scheduled)
        id: release_info
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No release found"
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Code checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_info.outputs.tag || github.ref }}

      - name: Get build information
        id: build_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SCHEDULE_VERSION: ${{ steps.release_info.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          case "$EVENT_NAME" in
            schedule) echo "version=$SCHEDULE_VERSION" >> "$GITHUB_OUTPUT" ;;
            release) echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT" ;;
            push) echo "version=$BRANCH-$SHORT_SHA" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)
              # Docker tag: lower case, [a-z0-9._-], at most 128 characters; reserved tags stay with the other triggers.
              TAG="${INPUT_TAG:-test-$BRANCH}"
              TAG=$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[^a-z0-9]+//' | cut -c1-128)
              if [ -z "$TAG" ] || [[ "$TAG" =~ ^(latest|main|dev|alpha|beta|rc|v[0-9].*)$ ]]; then
                echo "::error::Image tag '$TAG' is empty or reserved (latest, main, dev, alpha, beta, rc, v*)"
                exit 1
              fi
              echo "test_tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "version=test-$SHORT_SHA" >> "$GITHUB_OUTPUT"
              echo "Test image tag: $TAG"
              ;;
          esac

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false) || github.event_name == 'schedule' }}
            type=raw,value=${{ steps.release_info.outputs.tag }},enable=${{ github.event_name == 'schedule' }}
            type=ref,event=tag
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.build_info.outputs.test_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=alpha,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-alpha') }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-beta') }}
            type=raw,value=rc,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-rc') }}
          labels: |
            org.opencontainers.image.version=${{ steps.build_info.outputs.version }}
            org.opencontainers.image.revision=${{ steps.build_info.outputs.sha }}
            org.opencontainers.image.licenses=MIT

      # No QEMU: the Dockerfile cross-compiles on the build platform and the runtime stage has no RUN instructions.
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scheduled runs check out the latest release tag, which may predate the action, so fetch it from the ref this
      # workflow runs from (inside .github, so .dockerignore keeps it out of the build context).
      - name: Check out the stamp-version action
        if: "(github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'schedule'"
        uses: actions/checkout@v7
        with:
          path: .github/workflow-actions
          sparse-checkout: .github/actions/stamp-version

      - name: Update version in package.json (tag)
        if: "(github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'schedule'"
        uses: ./.github/workflow-actions/.github/actions/stamp-version
        with:
          version: ${{ steps.build_info.outputs.version }}

      - name: Build and Push (tag)
        uses: docker/build-push-action@v7
        if: "(github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'schedule'"
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: 'linux/amd64,linux/arm64'
          build-args: |
            VERSION=${{ steps.build_info.outputs.version }}
            REVISION=${{ steps.build_info.outputs.sha }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=tagged
          cache-to: type=gha,scope=tagged,mode=max

      - name: Build and Push (branch / test)
        uses: docker/build-push-action@v7
        if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: 'linux/amd64,linux/arm64'
          build-args: |
            VERSION=${{ steps.build_info.outputs.version }}
            REVISION=${{ steps.build_info.outputs.sha }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=${{ github.event_name == 'workflow_dispatch' && 'test' || github.ref_name }}
          cache-to: type=gha,scope=${{ github.event_name == 'workflow_dispatch' && 'test' || github.ref_name }},mode=max
