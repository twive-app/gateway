name: Docker Publish

on:
  push:
    branches:
      - dev
  release:
    types:
      - published
  # Weekly rebuild of the latest release with updated base images.
  schedule:
    - cron: '0 0 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Releases and scheduled builds always run, even if the tagged commit contains [docker skip].
    if: "github.event_name != 'push' || (!contains(github.event.head_commit.message, 'skip docker') && !contains(github.event.head_commit.message, 'docker skip'))"
    steps:
      # Fetch the latest release tag before checkout and metadata so we can check out the correct ref and tag the image.
      - name: Get latest release tag (scheduled)
        id: release_info
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No release found"
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_info.outputs.tag || github.ref }}

      - name: Get build information
        id: build_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SCHEDULE_TAG: ${{ steps.release_info.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          # Releases (and their weekly rebuild) use the version of package.json, which the release workflow checked
          # against the tag; dev images append the commit: 1.3.0-dev.abc1234.
          VERSION=$(jq -r .version package.json)
          case "$EVENT_NAME" in
            schedule|release)
              EXPECTED="${RELEASE_TAG:-$SCHEDULE_TAG}"
              if [ "v$VERSION" != "$EXPECTED" ]; then
                echo "::error::package.json has $VERSION, but the release is $EXPECTED"
                exit 1
              fi
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              ;;
            push) echo "version=$VERSION-$BRANCH.$SHORT_SHA" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false) || github.event_name == 'schedule' }}
            type=raw,value=${{ steps.release_info.outputs.tag }},enable=${{ github.event_name == 'schedule' }}
            type=ref,event=tag
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=raw,value=alpha,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-alpha') }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-beta') }}
            type=raw,value=rc,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-rc') }}
          labels: |
            org.opencontainers.image.version=${{ steps.build_info.outputs.version }}
            org.opencontainers.image.revision=${{ steps.build_info.outputs.sha }}
            org.opencontainers.image.licenses=MIT

      # No QEMU: the Dockerfile cross-compiles on the build platform and the runtime stage has no RUN instructions.
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push (tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: "(github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'schedule'"
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: 'linux/amd64,linux/arm64'
          build-args: |
            VERSION=${{ steps.build_info.outputs.version }}
            REVISION=${{ steps.build_info.outputs.sha }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=tagged
          cache-to: type=gha,scope=tagged,mode=max

      - name: Build and Push (branch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: "github.event_name == 'push'"
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: 'linux/amd64,linux/arm64'
          build-args: |
            VERSION=${{ steps.build_info.outputs.version }}
            REVISION=${{ steps.build_info.outputs.sha }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max
