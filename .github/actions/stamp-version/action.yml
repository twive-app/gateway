name: Stamp version
description: Replace the canary version in package.json with the release version and fail if the replacement did not happen

inputs:
  version:
    description: The version to stamp, with or without the leading v
    required: true

runs:
  using: composite
  steps:
    - name: Stamp version in package.json
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        VERSION="${VERSION#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "Invalid version '$VERSION', refusing to update package.json"
          exit 1
        fi
        # -i.bak works with GNU and BSD sed
        sed -i.bak "s|\"version\": \"0.0.0-canary\",|\"version\": \"$VERSION\",|" package.json && rm package.json.bak
        if ! grep -qF "\"version\": \"$VERSION\"," package.json; then
          echo "Version stamp failed, package.json still does not contain '$VERSION'"
          exit 1
        fi
        echo "Stamped version $VERSION"
