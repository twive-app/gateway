description: |-
  Self-hosted WebSocket gateway for Twitch EventSub: receives the EventSub webhooks of every connected app and
  forwards them to the app's clients over a WebSocket. Needs a Redis with persistence and two allocations – the
  primary one for the webhook (HTTP) and a second one for the WebSocket. Both belong behind a reverse proxy with
  TLS. https://github.com/twive-app/gateway
tags:
  - twitch
  - gateway
